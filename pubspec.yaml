name: http_kit
description: >
  A portable HTTP client with an onion middleware pipeline: retry with full-jitter backoff, timeouts,
  bearer authentication and metadata headers, on Cronet, Cupertino or the browser stack.

# Until core_model is on pub.dev this package is consumed by git tag; pub.dev rejects git
# dependencies.
publish_to: none

version: 0.1.0

homepage: https://github.com/zs-dima/http_kit
repository: https://github.com/zs-dima/http_kit
issue_tracker: https://github.com/zs-dima/http_kit/issues

topics:
  - http
  - middleware
  - retry
  - cronet
  - quic

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  core_model:
    git:
      url: https://github.com/zs-dima/core_model.git
      ref: v0.1.0

  # `compute` and `kDebugMode`.
  flutter:
    sdk: flutter
  meta: ^1.16.0

  http: ^1.6.0
  # The platform engines: Cronet on Android, NSURLSession on Apple platforms.
  cronet_http: ^1.9.0
  cupertino_http: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints_tool:
    git:
      url: https://github.com/zs-dima/lints_tool.git
      ref: v1.0.1
